name: snipr-ci

on:
  push:
    branches: ["**"]
    paths:
      - "projects/a2-snipr/**"
      - ".github/workflows/snipr-ci.yml"
  pull_request:
    paths:
      - "projects/a2-snipr/**"
      - ".github/workflows/snipr-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/a2-snipr/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snipr
          POSTGRES_PASSWORD: snipr
          POSTGRES_DB: snipr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snipr -d snipr"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://snipr:snipr@localhost:5432/snipr?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/a2-snipr/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/a2-snipr/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/a2-snipr/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
