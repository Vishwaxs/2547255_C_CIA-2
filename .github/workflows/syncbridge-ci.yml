name: SyncBridge CI

on:
  push:
    paths:
      - "projects/c1-syncbridge/**"
      - ".github/workflows/syncbridge-ci.yml"
  pull_request:
    paths:
      - "projects/c1-syncbridge/**"
      - ".github/workflows/syncbridge-ci.yml"

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/c1-syncbridge/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: syncbridge
          POSTGRES_PASSWORD: syncbridge
          POSTGRES_DB: syncbridge
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U syncbridge -d syncbridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://syncbridge:syncbridge@localhost:5434/syncbridge?schema=public
      REDIS_URL: redis://localhost:6381
      PORT: 4002
      CORS_ORIGIN: http://localhost:5175

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/c1-syncbridge/backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/c1-syncbridge/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/c1-syncbridge/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
