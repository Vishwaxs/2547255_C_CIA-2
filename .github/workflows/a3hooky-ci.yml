name: A3 Hooky CI

on:
  push:
    paths:
      - "projects/a3-hooky/**"
      - ".github/workflows/a3hooky-ci.yml"
  pull_request:
    paths:
      - "projects/a3-hooky/**"
      - ".github/workflows/a3hooky-ci.yml"

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/a3-hooky/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hooky
          POSTGRES_PASSWORD: hooky
          POSTGRES_DB: hooky
        ports:
          - 5438:5432
        options: >-
          --health-cmd "pg_isready -U hooky -d hooky"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6385:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://hooky:hooky@localhost:5438/hooky?schema=public
      REDIS_URL: redis://localhost:6385
      PORT: 4006
      CORS_ORIGIN: http://localhost:5179
      START_WORKER: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/a3-hooky/backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/a3-hooky/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/a3-hooky/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
