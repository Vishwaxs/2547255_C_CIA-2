name: C2 TargetX CI

on:
  push:
    paths:
      - "projects/c2-targetx/**"
      - ".github/workflows/c2targetx-ci.yml"
  pull_request:
    paths:
      - "projects/c2-targetx/**"
      - ".github/workflows/c2targetx-ci.yml"

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/c2-targetx/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: targetx
          POSTGRES_PASSWORD: targetx
          POSTGRES_DB: targetx
        ports:
          - 5439:5432
        options: >-
          --health-cmd "pg_isready -U targetx -d targetx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6386:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://targetx:targetx@localhost:5439/targetx?schema=public
      REDIS_URL: redis://localhost:6386
      PORT: 4007
      CORS_ORIGIN: http://localhost:5180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/c2-targetx/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/c2-targetx/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/c2-targetx/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
