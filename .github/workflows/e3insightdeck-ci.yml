name: E3 InsightDeck CI

on:
  push:
    paths:
      - "projects/e3-insightdeck/**"
      - ".github/workflows/e3insightdeck-ci.yml"
  pull_request:
    paths:
      - "projects/e3-insightdeck/**"
      - ".github/workflows/e3insightdeck-ci.yml"

jobs:
  backend:
    name: backend (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/e3-insightdeck/backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: insightdeck
          POSTGRES_PASSWORD: insightdeck
          POSTGRES_DB: insightdeck
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U insightdeck -d insightdeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6383:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://insightdeck:insightdeck@localhost:5436/insightdeck?schema=public
      REDIS_URL: redis://localhost:6383
      PORT: 4004
      CORS_ORIGIN: http://localhost:5177
      NARRATOR_KIND: template

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/e3-insightdeck/backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/e3-insightdeck/frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projects/e3-insightdeck/frontend/package-lock.json

      - run: npm ci
      - run: npm run build
