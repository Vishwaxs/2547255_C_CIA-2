# Full local stack for SyncBridge: Postgres + Redis + backend + frontend.
# Use this when a Docker daemon is available:
#
#   docker compose -f docker-compose.full.yml up --build
#
#   frontend  -> http://localhost:8082
#   backend   -> http://localhost:4002

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncbridge
      POSTGRES_PASSWORD: syncbridge
      POSTGRES_DB: syncbridge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncbridge -d syncbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - syncbridge-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - syncbridge-redisdata:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4002
      PUBLIC_BASE_URL: http://localhost:4002
      DATABASE_URL: postgresql://syncbridge:syncbridge@postgres:5432/syncbridge?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8082
      START_WORKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4002:4002"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4002
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  syncbridge-pgdata:
  syncbridge-redisdata:
