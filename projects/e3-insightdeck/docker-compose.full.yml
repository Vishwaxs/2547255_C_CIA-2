# Full local stack for E3 InsightDeck: Postgres + Redis + backend + frontend.
# Use this when a Docker daemon is available:
#
#   docker compose -f docker-compose.full.yml up --build
#
#   frontend  -> http://localhost:8084
#   backend   -> http://localhost:4004

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightdeck
      POSTGRES_PASSWORD: insightdeck
      POSTGRES_DB: insightdeck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightdeck -d insightdeck"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - insightdeck-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - insightdeck-redisdata:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4004
      PUBLIC_BASE_URL: http://localhost:4004
      DATABASE_URL: postgresql://insightdeck:insightdeck@postgres:5432/insightdeck?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8084
      NARRATOR_KIND: template
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4004:4004"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4004
    depends_on:
      - backend
    ports:
      - "8084:80"

volumes:
  insightdeck-pgdata:
  insightdeck-redisdata:
