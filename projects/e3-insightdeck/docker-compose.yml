# Dev infra only: Postgres + Redis.
# Run backend and frontend on the host with `npm run dev`.
# For the full stack in Docker, use docker-compose.full.yml.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: insightdeck
      POSTGRES_PASSWORD: insightdeck
      POSTGRES_DB: insightdeck
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightdeck -d insightdeck"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5436:5432"
    volumes:
      - insightdeck-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6383:6379"
    volumes:
      - insightdeck-redisdata:/data

volumes:
  insightdeck-pgdata:
  insightdeck-redisdata:
