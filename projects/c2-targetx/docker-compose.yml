# Dev infra only: Postgres + Redis.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: targetx
      POSTGRES_PASSWORD: targetx
      POSTGRES_DB: targetx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U targetx -d targetx"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5439:5432"
    volumes:
      - targetx-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6386:6379"
    volumes:
      - targetx-redisdata:/data

volumes:
  targetx-pgdata:
  targetx-redisdata:
