# Full local stack for C2 TargetX: Postgres + Redis + backend + frontend.
# Use this when a Docker daemon is available:
#
#   docker compose -f docker-compose.full.yml up --build
#
#   frontend  -> http://localhost:8087
#   backend   -> http://localhost:4007

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: targetx
      POSTGRES_PASSWORD: targetx
      POSTGRES_DB: targetx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U targetx -d targetx"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - targetx-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - targetx-redisdata:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4007
      PUBLIC_BASE_URL: http://localhost:4007
      DATABASE_URL: postgresql://targetx:targetx@postgres:5432/targetx?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8087
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4007:4007"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4007
    depends_on:
      - backend
    ports:
      - "8087:80"

volumes:
  targetx-pgdata:
  targetx-redisdata:
