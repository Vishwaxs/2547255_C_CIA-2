# Full local stack for A1 PulseBoard: Postgres + Redis + backend + frontend.
# Use this when a Docker daemon is available:
#
#   docker compose -f docker-compose.full.yml up --build
#
#   frontend  -> http://localhost:8085
#   backend   -> http://localhost:4005

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulseboard
      POSTGRES_PASSWORD: pulseboard
      POSTGRES_DB: pulseboard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseboard -d pulseboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pulseboard-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pulseboard-redisdata:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4005
      PUBLIC_BASE_URL: http://localhost:4005
      DATABASE_URL: postgresql://pulseboard:pulseboard@postgres:5432/pulseboard?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8085
      START_STREAM: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4005:4005"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4005
    depends_on:
      - backend
    ports:
      - "8085:80"

volumes:
  pulseboard-pgdata:
  pulseboard-redisdata:
