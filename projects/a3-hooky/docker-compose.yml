# Dev infra only: Postgres + Redis.
# Run backend and frontend on the host with `npm run dev`.
# For the full stack in Docker, use docker-compose.full.yml.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hooky
      POSTGRES_PASSWORD: hooky
      POSTGRES_DB: hooky
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooky -d hooky"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5438:5432"
    volumes:
      - hooky-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6385:6379"
    volumes:
      - hooky-redisdata:/data

volumes:
  hooky-pgdata:
  hooky-redisdata:
