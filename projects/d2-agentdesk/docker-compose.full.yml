# Full local stack for D2 AgentDesk: Postgres + Redis + backend + frontend.
# Use this when a Docker daemon is available:
#
#   docker compose -f docker-compose.full.yml up --build
#
#   frontend  -> http://localhost:8088
#   backend   -> http://localhost:4008

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentdesk
      POSTGRES_PASSWORD: agentdesk
      POSTGRES_DB: agentdesk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentdesk -d agentdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agentdesk-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agentdesk-redisdata:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4008
      PUBLIC_BASE_URL: http://localhost:4008
      DATABASE_URL: postgresql://agentdesk:agentdesk@postgres:5432/agentdesk?schema=public
      # No pooler in the compose stack, so the direct URL is the same host.
      DIRECT_URL: postgresql://agentdesk:agentdesk@postgres:5432/agentdesk?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8088
      PLANNER_KIND: rule_based
      AGENT_MAX_STEPS: 6
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4008:4008"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4008
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  agentdesk-pgdata:
  agentdesk-redisdata:
