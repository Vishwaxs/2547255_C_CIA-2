# Dev infra only: Postgres + Redis.
# Run backend and frontend on the host with `npm run dev`.
# For the full stack in Docker, use docker-compose.full.yml.
#
#   docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: d1rag
      POSTGRES_PASSWORD: d1rag
      POSTGRES_DB: d1rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d1rag -d d1rag"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5435:5432"
    volumes:
      - d1rag-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6382:6379"
    volumes:
      - d1rag-redisdata:/data

volumes:
  d1rag-pgdata:
  d1rag-redisdata:
