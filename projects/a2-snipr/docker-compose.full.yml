# Full local stack for Snipr: Postgres + Redis + backend + frontend.
# Use this when a Docker daemon is available:
#
#   docker compose -f docker-compose.full.yml up --build
#
#   frontend  -> http://localhost:8080
#   backend   -> http://localhost:4000
#
# (docker-compose.yml ships only Postgres+Redis for host-based dev.)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: snipr
      POSTGRES_PASSWORD: snipr
      POSTGRES_DB: snipr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snipr -d snipr"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - snipr-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - snipr-redisdata:/data

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://snipr:snipr@postgres:5432/snipr?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  snipr-pgdata:
  snipr-redisdata:
